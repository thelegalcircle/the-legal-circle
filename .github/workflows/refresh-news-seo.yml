name: Refresh news SEO

on:
  push:
    branches: [main]
    paths:
      - news/articles.json
      - interviews/interviews.json
      - scripts/build-interviews.mjs
      - scripts/render-interviews-hub.mjs
      - interviews/upcoming.json
      - interviews/publication.json
      - scripts/build-adele-profile.mjs
      - scripts/build-news.mjs
      - scripts/build-test-home.mjs
      - events/events.json
      - events/index.html
      - scripts/check-news.mjs
      - scripts/check-test-home.mjs
      - scripts/check-pressfeed.mjs
      - scripts/related-articles.mjs
      - scripts/article-path.mjs
      - _templates/article.html
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-news-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate article metadata and sitemaps
        run: node scripts/build-news.mjs
      - name: Validate News SEO
        run: node scripts/check-news.mjs
      - name: Validate production homepage and Pressfeed
        run: node scripts/check-test-home.mjs && node scripts/check-pressfeed.mjs
      - name: Report generated changes for pull-request review
        run: |
          if ! git diff --quiet; then
            echo "::notice::Generated SEO changes are available in the workflow artifact. Publish them through a reviewed pull request; this job cannot write to production."
          fi
      - name: Save generated site for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-news-site
          retention-days: 14
          path: |
            news/
            interviews/
            about/
            index.html
            sitemap.xml
            news-sitemap.xml
