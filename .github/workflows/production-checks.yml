name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/build-news.mjs
      - run: node scripts/check-short-hyphens.mjs
      - run: node scripts/check-news.mjs
      - run: node scripts/check-test-home.mjs
      - run: node scripts/check-pressfeed.mjs
