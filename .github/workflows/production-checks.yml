name: Production checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-news.mjs
      - run: node scripts/check-news.mjs
      - run: node scripts/check-test-home.mjs
      - run: node scripts/check-pressfeed.mjs
